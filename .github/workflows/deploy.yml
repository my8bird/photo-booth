name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Check secrets
        run: |
          echo "Checking environment secrets..."
          if [ -z "${{ secrets.VITE_GOOGLE_CLIENT_ID }}" ]; then
            echo "❌ VITE_GOOGLE_CLIENT_ID is NOT set"
          else
            echo "✅ VITE_GOOGLE_CLIENT_ID is set"
          fi
          if [ -z "${{ secrets.VITE_GOOGLE_REDIRECT_URI }}" ]; then
            echo "❌ VITE_GOOGLE_REDIRECT_URI is NOT set"
          else
            echo "✅ VITE_GOOGLE_REDIRECT_URI is set"
          fi
          if [ -z "${{ secrets.VITE_BACKEND_URL }}" ]; then
            echo "❌ VITE_BACKEND_URL is NOT set"
          else
            echo "✅ VITE_BACKEND_URL is set"
          fi

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
